# 落地页 Nginx 配置：支持 SPA history 路由并提供独立健康检查。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态文件不存在时返回 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不记录健康检查访问日志，减少容器日志噪声。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

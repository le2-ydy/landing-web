# 落地页 Nginx 配置：优先提供预渲染页面，并为未知路径返回静态 404。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;

    location / {
        try_files $uri.html $uri $uri/ $uri/index.html =404;
    }

    # 不记录健康检查访问日志，减少容器日志噪声。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
